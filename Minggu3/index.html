<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login ke website</title>
  <link rel="icon" type="image/jpg" href="fútbol Club Barcelona.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-[url('Barça.jpg')] bg-cover bg-center">
  <div class="w-full max-w-sm bg-[url('Barça.jpg')] bg-cover bg-center rounded-xl shadow-xl p-8 relative overflow-hidden">

    <div class="absolute inset-0 bg-black/40"></div>

    <div class="relative">
      <div class="flex items-center gap-4 mb-6">
        <img src="fútbol Club Barcelona.jpg" alt="logo" class="w-16 h-16 object-cover rounded-lg">
        <div>
          <h1 class="text-2xl font-bold text-white">Loginkan boss</h1>
          <p class="text-sm text-slate-200">Silakan login culersss.</p>
        </div>
      </div>

      <form action="dashboard.html" method="get" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-white mb-1">Username</label>
          <input type="text" name="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-white mb-1">Password</label>
          <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>
        <button type="submit" class="mt-6 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg">Login</button>
      </form>

      <p class="text-sm text-slate-200 mt-4 text-center">Belum punya akun? <a href="register.html" class="text-blue-400 hover:text-blue-300 hover:underline">Daftar</a></p>
    </div>

  </div>
</body>
</html>
