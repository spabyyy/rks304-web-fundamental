<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Admin Panel</title>
  <link rel="icon" type="image/jpg" href="fútbol Club Barcelona.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[url('Barça.jpg')] bg-cover bg-center">
  <div class="w-full max-w-md bg-white rounded-xl shadow p-8">
    <div class="flex items-center gap-4 mb-6">
  <img src="fútbol Club Barcelona.jpg" alt="logo" class="w-16 h-16 object-cover rounded-lg">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">Daftar Akun</h1>
    <p class="text-sm text-slate-500">Lengkapi data berikut untuk mendaftar.</p>
  </div>
</div>

<form id="formRegister" action="dashboard.html" ...>
    <form id="formRegister" action="dashboard.html" method="get" class="space-y-4" novalidate>
      <div>
        <label for="username" class="block text-sm font-medium mb-1">Username</label>
        <input type="text" id="username" name="username" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-username" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" name="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-password" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label for="nama" class="block text-sm font-medium mb-1">Nama</label>
        <input type="text" id="nama" name="nama" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-nama" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label for="tanggal_lahir" class="block text-sm font-medium mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-tanggal_lahir" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label for="alamat" class="block text-sm font-medium mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <p id="err-alamat" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label for="telepon" class="block text-sm font-medium mb-1">Nomor Telepon</label>
        <input type="text" id="telepon" name="telepon" placeholder="62812xxxxxxx" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-telepon" class="text-red-600 text-xs mt-1 hidden"></p>
      </div>
      <button type="submit" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg">Daftar</button>
    </form>
    <p class="text-sm text-slate-500 mt-4 text-center">Sudah punya akun? <a href="index.html" class="text-indigo-600 hover:underline">Login</a></p>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
